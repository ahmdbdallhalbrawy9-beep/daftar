name: CI

on:
  pull_request:
  push:
    branches: [saeed-develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Check precache list
        run: node scripts/check-precache.mjs
