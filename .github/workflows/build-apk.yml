name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir app
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../index.html ../sw.js ../manifest.webmanifest ../firebase-config.js www/
          cp -r ../src www/src
          cp -r ../styles www/styles
          cp -r ../assets www/assets
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.daftar.wallet",
            "appName": "دفتر المحفظة",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android

      - name: Add SMS reader plugin
        run: |
          cd app
          JAVA_DIR=android/app/src/main/java/com/daftar/wallet
          mkdir -p $JAVA_DIR
          cat > $JAVA_DIR/MainActivity.java <<'EOF'
          package com.daftar.wallet;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SmsReaderPlugin.class);
                  registerPlugin(DaftarPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > $JAVA_DIR/SmsReaderPlugin.java <<'EOF'
          package com.daftar.wallet;

          import android.Manifest;
          import android.database.Cursor;
          import android.net.Uri;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;

          @CapacitorPlugin(
              name = "SmsReader",
              permissions = { @Permission(strings = { Manifest.permission.READ_SMS }, alias = "sms") }
          )
          public class SmsReaderPlugin extends Plugin {
              @PluginMethod
              public void getSms(PluginCall call) {
                  if (getPermissionState("sms") != PermissionState.GRANTED) {
                      call.reject("no permission");
                      return;
                  }
                  long since = call.getData().optLong("since", 0);
                  int limit = call.getData().optInt("limit", 300);
                  JSArray arr = new JSArray();
                  Cursor c = null;
                  try {
                      c = getContext().getContentResolver().query(
                          Uri.parse("content://sms/inbox"),
                          new String[] { "_id", "address", "body", "date" },
                          "date>? AND address LIKE ?",
                          new String[] { String.valueOf(since), "%VF%" },
                          "date ASC LIMIT " + limit
                      );
                      while (c != null && c.moveToNext()) {
                          JSObject o = new JSObject();
                          o.put("id", c.getLong(0));
                          o.put("address", c.getString(1));
                          o.put("body", c.getString(2));
                          o.put("date", c.getLong(3));
                          arr.put(o);
                      }
                  } catch (Exception e) {
                      call.reject("read failed: " + e.getMessage());
                      return;
                  } finally {
                      if (c != null) c.close();
                  }
                  JSObject ret = new JSObject();
                  ret.put("messages", arr);
                  call.resolve(ret);
              }
          }
          EOF

      - name: Add background service + notifications plugin
        run: |
          cd app
          JAVA_DIR=android/app/src/main/java/com/daftar/wallet
          cp ../android-native/*.java $JAVA_DIR/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <application#' $M
          sed -i 's#</application>#    <service android:name="com.daftar.wallet.KeepAliveService" android:exported="false" android:foregroundServiceType="dataSync" />\n        <receiver android:name="com.daftar.wallet.BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver>\n    </application>#' $M
          grep -q KeepAliveService $M && grep -q POST_NOTIFICATIONS $M || { echo "manifest patch failed"; exit 1; }

      - name: Permissions, icon, sync
        run: |
          cd app
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_SMS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp ../assets/icon-192.png $d/ic_launcher.png
            cp ../assets/icon-192.png $d/ic_launcher_round.png
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android

      - name: Use fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > "$RUNNER_TEMP/debug-key.bin"
            rm -f ~/.android/debug.keystore
            # Gradle only reads a JKS debug keystore (a PKCS12 one is silently replaced by a fresh
            # random key on every build, which breaks updates). Convert if needed, else use as is.
            if keytool -importkeystore -srckeystore "$RUNNER_TEMP/debug-key.bin" -srcstoretype PKCS12 \
                 -srcstorepass android -destkeystore ~/.android/debug.keystore -deststoretype JKS \
                 -deststorepass android -noprompt; then
              echo "Converted PKCS12 key to JKS"
            else
              cp "$RUNNER_TEMP/debug-key.bin" ~/.android/debug.keystore
            fi
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "androiddebugkey\|SHA"
            # Tell Gradle explicitly which keystore to sign debug builds with (relying on the default
            # location was silently ignored); fail loudly if the patch did not apply.
            sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file(System.getProperty("user.home") + "\/.android\/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' app/android/app/build.gradle
            grep -q 'debug.keystore' app/android/app/build.gradle || { echo "signing patch did not apply"; exit 1; }
            echo "Using fixed signing key"
          else
            echo "No fixed key set, using a temporary key"
          fi

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: daftar-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a direct-download release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="v1.${{ github.run_number }}"
            NAME="daftar-v1.${{ github.run_number }}.apk"
            cp "$APK" "$NAME"
            gh release create "$TAG" "$NAME" --title "$TAG" --generate-notes
            # keep only the latest 5 v1.* releases
            gh release list --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("v1."))] | sort_by(.createdAt) | reverse | .[5:][] | .tagName' \
              | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
          else
            TAG="preview"
            NAME="daftar-preview.apk"
            cp "$APK" "$NAME"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Preview build" \
              --notes "Always the latest test build from a PR or a manual run — not a stable release." --prerelease
            gh release upload "$TAG" "$NAME" --clobber
          fi
